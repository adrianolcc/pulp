# PULP stack. Start it with `make up PROFILES=core[,enterprise,robot,robot-lite,ai]`;
# the Makefile passes --env-file .env, so every ${VAR} below comes from .env.
#
# Profiles (docs/spec.md, "Runtime environment"):
#   core        broker, historian database, Grafana; later the simulators, gateway and services
#   enterprise  Odoo with OdooPLM and the integration service (WP-10, WP-11)
#   robot       ROS 2 cell, cell controller, onboarding (WP-13 to WP-17)
#   robot-lite  the Python robot stand-in, onboarding (WP-16, WP-17)
#   ai          tool server, approval queue, agent, indexer (WP-18 to WP-21)
# Only core has services so far; the others are filled in by their work packages.
#
# Health checks run every 2 s while a container starts (so `make up` returns
# quickly) and every 30 s after that (so the logs stay readable).
#
# Published ports bind to 127.0.0.1: Windows tools (browser, MQTT Explorer, UaExpert)
# still reach them as localhost through Docker Desktop, but nothing else on the
# network can.

services:
  # --- UNS broker ------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine
    profiles: [core]
    # Our entrypoint writes the password file from .env, then hands over to the
    # image's own entrypoint.
    entrypoint: ["/bin/sh", "/pulp/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/pulp/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"
    networks: [operations]
    healthcheck:
      # Healthy means: accepts a login and delivers a message. $SYS topics are
      # retained by the broker, so one arrives right after subscribing.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 1883 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD"
          -t '$$SYS/broker/version' -C 1 -W 3 > /dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  # --- Historian and event journal -------------------------------------------
  timescaledb:
    # The -ha image ships TimescaleDB together with pgvector (needed for document
    # search in WP-18); the smaller timescale/timescaledb image has no pgvector.
    image: timescale/timescaledb-ha:pg17.11-ts2.32.0
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by historian/migrations/0002_grafana_reader.sh.
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?set GRAFANA_DB_USER in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    # No telemetry calls to Timescale: the stack runs offline. (The -ha image
    # ignores the TIMESCALEDB_TELEMETRY variable, so it is set as a server option.)
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    volumes:
      # Runs once, on an empty data volume only; see historian/migrations/README.md.
      - ../historian/migrations:/docker-entrypoint-initdb.d:ro
      - timescaledb-data:/home/postgres/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [operations]
    healthcheck:
      # -h 127.0.0.1 on purpose: while the init scripts run, Postgres listens on
      # its Unix socket only, so a TCP check stays red until initialisation is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  # --- Trends ----------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles: [core]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Applied when Grafana creates its own database, i.e. on the first start only.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Offline: no usage reports, update checks or plugin downloads at startup.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Expanded inside the provisioning file.
      POSTGRES_HOST: ${POSTGRES_HOST:-timescaledb}
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [operations]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

# One network per Purdue zone (docs/spec.md, "Stack choices"). Only level 3,
# site operations (UNS, historian, trends), exists so far. The control zone
# (stations, edge gateway) and the enterprise zone (Odoo, integration) arrive
# with their services, so the segmentation is designed where it is used.
networks:
  operations:

volumes:
  mosquitto-data:
  timescaledb-data:
  grafana-data:
