# Mosquitto, the PULP UNS broker. Mounted read-only into the container.
# Topic access rules (ACLs) per user come with the security work (WP-23).

# The same users and rules apply to both listeners.
per_listener_settings false

# Keep retained messages and queued QoS 1/2 messages across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Nobody connects without a user. The password file is written at startup
# from MQTT_USERNAME and MQTT_PASSWORD in .env (see entrypoint.sh).
allow_anonymous false
password_file /mosquitto/config/passwd

# Services, edge gateway, MQTT Explorer.
listener 1883
protocol mqtt

# The browser control room (MQTT over WebSockets).
listener 9001
protocol websockets
