name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and the workspace
        # --locked fails if uv.lock is out of date with the pyproject files,
        # instead of silently resolving new versions in CI.
        run: |
          uv python install
          uv sync --locked --all-packages

      - name: Lint
        run: make lint

      - name: Unit and contract tests
        run: make test
